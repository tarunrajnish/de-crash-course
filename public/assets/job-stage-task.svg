<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 840" role="img" aria-labelledby="diagram-title diagram-description" font-family="system-ui, sans-serif" fill="#283326">
  <title id="diagram-title">One job, two stages, six tasks</title>
  <desc id="diagram-description">The collect action starts Job 0. Stage 0 has three tasks for three input partitions. A shuffle groups customer keys into three downstream partitions. Stage 1 has three tasks for those partitions and finishes the customer totals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#527344"/>
    </marker>
  </defs>
  <rect width="480" height="840" fill="#eee9d8"/>
  <text x="240" y="36" text-anchor="middle" font-size="24" font-weight="600">Action: collect()</text>
  <path d="M240 48 V78" stroke="#527344" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="12" y="84" width="456" height="740" rx="12" fill="#faf7ee" stroke="#527344" stroke-width="2"/>
  <text x="32" y="122" font-size="26" font-weight="700">Job 0</text>
  <text x="32" y="148" font-size="21">2 stages, 6 tasks in total</text>

  <rect x="32" y="168" width="416" height="218" rx="10" fill="#e5eedf" stroke="#799866" stroke-width="2"/>
  <text x="48" y="202" font-size="24" font-weight="700">Stage 0: 3 input partitions</text>
  <text x="48" y="230" font-size="21">Read, filter, partial sums</text>
  <g fill="#faf7ee" stroke="#799866" stroke-width="2">
    <rect x="48" y="252" width="112" height="108" rx="8"/>
    <rect x="184" y="252" width="112" height="108" rx="8"/>
    <rect x="320" y="252" width="112" height="108" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="24" font-weight="600">
    <text x="104" y="283">Task 0</text>
    <text x="240" y="283">Task 1</text>
    <text x="376" y="283">Task 2</text>
  </g>
  <g text-anchor="middle" font-size="21">
    <text x="104" y="320">Input P0</text>
    <text x="240" y="320">Input P1</text>
    <text x="376" y="320">Input P2</text>
  </g>

  <g fill="none" stroke="#527344" stroke-width="2" marker-end="url(#arrow)">
    <path d="M104 386 V574"/>
    <path d="M104 386 L240 574"/>
    <path d="M240 386 V574"/>
    <path d="M240 386 L376 574"/>
    <path d="M376 386 L104 574"/>
    <path d="M376 386 V574"/>
  </g>
  <rect x="32" y="434" width="416" height="108" rx="10" fill="#f4e6e5" stroke="#a45a63" stroke-width="2"/>
  <text x="240" y="464" text-anchor="middle" font-size="24" font-weight="700" fill="#793c45">Shuffle boundary</text>
  <text x="240" y="492" text-anchor="middle" font-size="21">Group matching customer keys</text>
  <text x="240" y="520" text-anchor="middle" font-size="20">A to P0    B to P1    C to P2</text>

  <rect x="32" y="580" width="416" height="220" rx="10" fill="#e5eedf" stroke="#799866" stroke-width="2"/>
  <text x="48" y="616" font-size="24" font-weight="700">Stage 1: 3 shuffle partitions</text>
  <text x="48" y="644" font-size="21">Fetch data, finish customer sums</text>
  <g fill="#faf7ee" stroke="#799866" stroke-width="2">
    <rect x="48" y="664" width="112" height="108" rx="8"/>
    <rect x="184" y="664" width="112" height="108" rx="8"/>
    <rect x="320" y="664" width="112" height="108" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="24" font-weight="600">
    <text x="104" y="695">Task 3</text>
    <text x="240" y="695">Task 4</text>
    <text x="376" y="695">Task 5</text>
  </g>
  <g text-anchor="middle" font-size="20">
    <text x="104" y="730">Shuffle P0</text>
    <text x="240" y="730">Shuffle P1</text>
    <text x="376" y="730">Shuffle P2</text>
    <text x="104" y="756">Customer A</text>
    <text x="240" y="756">Customer B</text>
    <text x="376" y="756">Customer C</text>
  </g>
</svg>
