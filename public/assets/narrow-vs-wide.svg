<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!--
    Narrow vs wide transformations.
    Timeline (12s loop, SMIL begin offsets):
      0.0 - 4.5s : narrow path animates (filter / withColumn), one stage, no crossing
      4.5 - 5.0s : shuffle boundary line draws in
      5.0 - 9.5s : wide path animates (groupBy), second stage, arrows cross
      9.5 - 12.0s: hold final frame
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowShuffle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c05621"/>
    </marker>
    <style>
      text { fill: #1a202c; }
      .title { font-size: 20px; font-weight: 700; }
      .caption { font-size: 15px; fill: #2d3748; }
      .sub { font-size: 13px; fill: #4a5568; }
      .label { font-size: 13px; font-weight: 600; }
      .stagebox { fill: none; stroke: #2b6cb0; stroke-width: 2; stroke-dasharray: 6 4; }
      .shufflebox { fill: none; stroke: #c05621; stroke-width: 2; stroke-dasharray: 6 4; }
      .part { fill: #bee3f8; stroke: #2b6cb0; stroke-width: 1.5; }
      .partOut { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.5; }
      .task { fill: #fefcbf; stroke: #b7791f; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" class="title">Narrow vs Wide Transformations</text>

  <!-- ===================== STAGE 1: narrow ===================== -->
  <g id="stage1">
    <rect x="40" y="70" width="380" height="330" rx="10" class="stagebox"/>
    <text x="60" y="95" class="label" fill="#2b6cb0">Stage 0</text>
    <text x="60" y="113" class="sub">filter(...).withColumn(...)</text>

    <!-- input partitions -->
    <g>
      <rect x="70" y="140" width="70" height="46" rx="6" class="part"/>
      <text x="105" y="168" text-anchor="middle" class="label">P0</text>
      <rect x="70" y="210" width="70" height="46" rx="6" class="part"/>
      <text x="105" y="238" text-anchor="middle" class="label">P1</text>
      <rect x="70" y="280" width="70" height="46" rx="6" class="part"/>
      <text x="105" y="308" text-anchor="middle" class="label">P2</text>
    </g>
    <text x="105" y="128" text-anchor="middle" class="sub">input</text>

    <!-- tasks -->
    <g>
      <rect x="210" y="140" width="80" height="46" rx="6" class="task"/>
      <text x="250" y="163" text-anchor="middle" class="label">task 0</text>
      <text x="250" y="178" text-anchor="middle" class="sub">1:1</text>
      <rect x="210" y="210" width="80" height="46" rx="6" class="task"/>
      <text x="250" y="233" text-anchor="middle" class="label">task 1</text>
      <text x="250" y="248" text-anchor="middle" class="sub">1:1</text>
      <rect x="210" y="280" width="80" height="46" rx="6" class="task"/>
      <text x="250" y="303" text-anchor="middle" class="label">task 2</text>
      <text x="250" y="318" text-anchor="middle" class="sub">1:1</text>
    </g>

    <!-- output partitions -->
    <g>
      <rect x="340" y="140" width="60" height="46" rx="6" class="partOut"/>
      <text x="370" y="168" text-anchor="middle" class="label">P0'</text>
      <rect x="340" y="210" width="60" height="46" rx="6" class="partOut"/>
      <text x="370" y="238" text-anchor="middle" class="label">P1'</text>
      <rect x="340" y="280" width="60" height="46" rx="6" class="partOut"/>
      <text x="370" y="308" text-anchor="middle" class="label">P2'</text>
    </g>

    <!-- straight arrows: input -> task -->
    <g stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)">
      <line x1="140" y1="163" x2="208" y2="163"/>
      <line x1="140" y1="233" x2="208" y2="233"/>
      <line x1="140" y1="303" x2="208" y2="303"/>
    </g>
    <!-- straight arrows: task -> output, no crossing -->
    <g stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)">
      <line x1="290" y1="163" x2="338" y2="163"/>
      <line x1="290" y1="233" x2="338" y2="233"/>
      <line x1="290" y1="303" x2="338" y2="303"/>
    </g>

    <!-- animated data pulse dots moving straight through, no crossing -->
    <g>
      <circle r="6" fill="#2b6cb0">
        <animateMotion dur="12s" repeatCount="indefinite"
          keyPoints="0;0.04;0.37;0.375;1" keyTimes="0;0.001;0.37;0.375;1"
          path="M105,163 L370,163"/>
      </circle>
      <circle r="6" fill="#2b6cb0">
        <animateMotion dur="12s" repeatCount="indefinite" begin="0.3s"
          keyPoints="0;0.04;0.33;0.335;1" keyTimes="0;0.001;0.33;0.335;1"
          path="M105,233 L370,233"/>
      </circle>
      <circle r="6" fill="#2b6cb0">
        <animateMotion dur="12s" repeatCount="indefinite" begin="0.6s"
          keyPoints="0;0.04;0.29;0.295;1" keyTimes="0;0.001;0.29;0.295;1"
          path="M105,303 L370,303"/>
      </circle>
    </g>

    <text x="230" y="385" text-anchor="middle" class="sub">1 input partition -&gt; 1 output partition, same executor, no data movement</text>
  </g>

  <!-- ===================== SHUFFLE BOUNDARY ===================== -->
  <g id="shuffleBoundary" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.375;0.42;0.99;1" values="0;0;1;1;0"/>
    <line x1="450" y1="60" x2="450" y2="410" stroke="#c05621" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="395" y="420" width="110" height="26" rx="5" fill="#c05621"/>
    <text x="450" y="438" text-anchor="middle" fill="#fff" class="label">SHUFFLE</text>
    <text x="450" y="60" text-anchor="middle" class="sub" dy="-6" fill="#c05621">Exchange</text>
  </g>

  <!-- ===================== STAGE 2: wide ===================== -->
  <g id="stage2" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.40;0.45;0.99;1" values="0;0;1;1;0"/>

    <rect x="480" y="70" width="380" height="330" rx="10" class="shufflebox"/>
    <text x="500" y="95" class="label" fill="#c05621">Stage 1</text>
    <text x="500" y="113" class="sub">groupBy(key).agg(...)</text>

    <!-- pre-shuffle map-side partitions (keyed) -->
    <g>
      <rect x="500" y="140" width="60" height="40" rx="6" class="part"/>
      <text x="530" y="164" text-anchor="middle" class="label" font-size="12">M0</text>
      <rect x="500" y="200" width="60" height="40" rx="6" class="part"/>
      <text x="530" y="224" text-anchor="middle" class="label" font-size="12">M1</text>
      <rect x="500" y="260" width="60" height="40" rx="6" class="part"/>
      <text x="530" y="284" text-anchor="middle" class="label" font-size="12">M2</text>
    </g>

    <!-- reducer / output buckets by hash(key) -->
    <g>
      <rect x="770" y="140" width="70" height="40" rx="6" class="partOut"/>
      <text x="805" y="164" text-anchor="middle" class="label" font-size="12">R0 (keyA)</text>
      <rect x="770" y="200" width="70" height="40" rx="6" class="partOut"/>
      <text x="805" y="224" text-anchor="middle" class="label" font-size="12">R1 (keyB)</text>
      <rect x="770" y="260" width="70" height="40" rx="6" class="partOut"/>
      <text x="805" y="284" text-anchor="middle" class="label" font-size="12">R2 (keyC)</text>
    </g>

    <!-- crossing lines: every mapper can feed every reducer -->
    <g stroke="#c05621" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowShuffle)">
      <line x1="560" y1="160" x2="768" y2="160"/>
      <line x1="560" y1="160" x2="768" y2="220"/>
      <line x1="560" y1="160" x2="768" y2="280"/>
      <line x1="560" y1="220" x2="768" y2="160"/>
      <line x1="560" y1="220" x2="768" y2="220"/>
      <line x1="560" y1="220" x2="768" y2="280"/>
      <line x1="560" y1="280" x2="768" y2="160"/>
      <line x1="560" y1="280" x2="768" y2="220"/>
      <line x1="560" y1="280" x2="768" y2="280"/>
    </g>

    <!-- animated dots crossing paths, by-key routing -->
    <circle r="5" fill="#c05621">
      <animateMotion dur="12s" begin="0s" repeatCount="indefinite"
        keyPoints="0;0.42;0.45;0.6;0.605;1" keyTimes="0;0.42;0.45;0.6;0.605;1"
        path="M530,160 L805,280"/>
    </circle>
    <circle r="5" fill="#c05621">
      <animateMotion dur="12s" begin="0.2s" repeatCount="indefinite"
        keyPoints="0;0.43;0.46;0.6;0.605;1" keyTimes="0;0.43;0.46;0.6;0.605;1"
        path="M530,220 L805,160"/>
    </circle>
    <circle r="5" fill="#c05621">
      <animateMotion dur="12s" begin="0.4s" repeatCount="indefinite"
        keyPoints="0;0.44;0.47;0.6;0.605;1" keyTimes="0;0.44;0.47;0.6;0.605;1"
        path="M530,280 L805,220"/>
    </circle>
    <circle r="5" fill="#c05621">
      <animateMotion dur="12s" begin="0.1s" repeatCount="indefinite"
        keyPoints="0;0.42;0.45;0.6;0.605;1" keyTimes="0;0.42;0.45;0.6;0.605;1"
        path="M530,160 L805,160"/>
    </circle>

    <text x="670" y="385" text-anchor="middle" class="sub">every partition can feed every reducer: data crosses the network by key</text>
  </g>

  <text x="450" y="470" text-anchor="middle" class="caption">A stage boundary IS a shuffle boundary: every Exchange node in the physical plan starts a new stage.</text>
</svg>
